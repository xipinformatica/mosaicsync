name: MosaicSync 1.30.18.11 certification
on:
  push:
    branches: ["release/1.30.18.11-certification"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect frozen .10 baseline targets
        shell: bash
        run: |
          echo '=== BASELINE ==='; git rev-parse HEAD; node --version
          echo '=== writeLocalMeta contexts ==='
          grep -RFn --exclude-dir=dist --exclude-dir=.git 'writeLocalMeta(' src || true
          for f in src/shared/background/background.js src/shared/core/storage.js src/shared/newtab/newtab.js src/shared/sync/sync-engine.js; do
            echo "--- $f"; grep -n -B8 -A10 'writeLocalMeta(' "$f" || true; done
          echo '=== FV symbols ==='
          grep -nEi -B8 -A18 'frequent.*icon|icon.*frequent|frequentRenderSnapshot|updateFrequent|renderFrequently|sanitizeFrequent|topSites' src/shared/newtab/newtab.js | head -900 || true
          echo '=== image/decode helpers ==='
          grep -n -B8 -A25 -E 'remoteImageViaCanvas|optimizeImageDataUrl|\.decode\(' src/shared/newtab/newtab.js | head -500 || true
          echo '=== storage ownership ==='
          grep -n -B15 -A35 -E 'withLocalAssetWriteLock|warmSessionRenderCache|needsAssetMigration|const writes = \{|writeActiveSpace|writeLocalMeta' src/shared/core/storage.js | head -1000 || true
          echo '=== appearance ==='
          grep -n -B20 -A65 'function applyPageBackgroundVisual' src/shared/newtab/newtab.js || true
          echo '=== constants/version docs ==='
          grep -RFn --exclude-dir=dist --exclude-dir=.git '1.30.18.10' src README.md README-DEVELOPMENT.md CHANGELOG.md docs tests package*.json || true
      - name: Baseline test count
        run: npm test
