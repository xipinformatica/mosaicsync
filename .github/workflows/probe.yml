name: MosaicSync source import probe

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write probe
        run: |
          echo "actions-ok" > ACTIONS-PROBE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACTIONS-PROBE.txt
          git commit -m "Confirm source import automation" || exit 0
          git push
